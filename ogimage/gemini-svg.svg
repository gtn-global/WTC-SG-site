<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    
    <!-- 点缀渐变 -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- 背景底色 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 全球化线条背景水纹（右侧装饰） -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="1000" cy="315" r="250" fill="none"/>
    <circle cx="1000" cy="315" r="400" fill="none"/>
    <circle cx="1000" cy="315" r="550" fill="none"/>
    <line x1="100" y1="315" x2="1200" y2="315"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- 顶端品牌色条 -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- 内容区域 -->
  <!-- 1. 属性/身份标识 -->
  <text x="100" y="150" fill="#38BDF8" font-size="20" font-weight="700" letter-spacing="4">OFFICIAL MEMBER</text>

  <!-- 2. 主标题：WTC Singapore -->
  <text x="100" y="255" fill="#FFFFFF" font-size="88" font-weight="800" letter-spacing="-1.5">WTC Singapore</text>

  <!-- 3. 副标题：WTCA 全称背书 -->
  <text x="100" y="325" fill="#94A3B8" font-size="34" font-weight="500" letter-spacing="1">World Trade Centers Association</text>

  <!-- 分隔线 -->
  <line x1="100" y1="385" x2="1100" y2="385" stroke="#334155" stroke-width="2"/>

  <!-- 4. 业务标签：全球链接感 -->
  <text x="100" y="455" fill="#E2E8F0" font-size="26" font-weight="500" letter-spacing="0.5">
    Global Connectivity <tspan fill="#38BDF8" font-weight="700"> · </tspan> Strategic Alliances <tspan fill="#38BDF8" font-weight="700"> · </tspan> Cross-Border Expansion
  </text>

  <!-- 5. 底部域名胶囊 -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="180" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="27" fill="#F8FAFC" font-size="19" font-weight="600" text-anchor="middle" letter-spacing="1">wtcasg.org</text>
  </g>
</svg>
